# CI — product checks, backlog checks, and standalone core-image delivery.
#
# `changes` classifies the change. `ci-product` runs the isolated full check when
# product code changed. `ci-backlog` runs the tracked-work gates and the
# present-documents check. `ci-core-image` builds the standalone core image on
# product pull requests with read-only permissions. `ci-core-image-publish`
# publishes only that core image on every push to main and is the only job that
# asks for packages: write. The platform loader image is built by the release
# workflow. There is no Docker-run instance image or host-side test exception.
#
# `--no-renames` in the first job is not a detail: `git diff --name-only`
# reports a detected rename by its destination alone, so moving product code
# into a document tree would reach the classifier as one document path and come
# back product=false — a deletion that breaks imports could then merge without
# typecheck, lint or the suite.
#
# A skipped job reports as a success to a required check on GitHub, so a change
# that does not owe the product checks passes under branch protection that
# requires them: the skip is what "not owed" looks like there, not a failure
# somebody has to override. Branch protection on main requires `changes`,
# `ci-product` and `ci-backlog`; `ci-core-image` runs on product pull requests but
# is not required (owner, 2026-10-09; docs/backlog-integration.md).
#
# `npm run check` and this job run the same checks through the same launcher
# command, on node 24, with no `npm ci` on the host in either place: the
# launcher provisions what it needs inside the boundary and fails closed when
# it cannot (AGENTS.md, "Test isolation"). What `npm ci` used to prove here —
# a `package.json` that agrees with `package-lock.json` — the suite itself now
# proves, in tests/unit/test-entrypoints.test.ts, inside the boundary.
#
# ci-backlog needs node and a full history. Its backlog, commit-link and
# present-document steps mirror the local hooks (.githooks/pre-commit,
# .githooks/commit-msg), which a push is one --no-verify away from skipping.
# The same required job also owns the pinned, checksum-verified expanding-only
# migration lint, so a red squawk result blocks the documented merge path:
#
#   1. the backlog gate: the export at the head of the change judged against
#      the export at its baseline, under the config's strength (block-new),
#      each judged by the config of its own day;
#   2. the commit-link check: every commit the change introduces names a leaf
#      task that exists;
#   3. the present-documents check, on pull requests only: the documents the
#      config lists as describing the present may not be left naming a path
#      the change removed.

name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Which checks a change owes is decided by what it changes. A path that
  # cannot change what the product does — the tracker's export, the documents,
  # the backlog gate's own files, the git hooks, connect-clone.sh — owes the
  # backlog checks, not typecheck, lint and the suite; everything else,
  # .github/ and the scripts included, owes them. Reading the change, the
  # classifier and the verdict are scripts with tests of their own
  # (scripts/ci-changed-paths.sh, scripts/ci-product-paths.sh,
  # scripts/ci-verdict.sh, tests/unit/ci-product-paths.test.ts) rather than
  # shell inlined here, so the same commands can be run and checked locally.
  changes:
    runs-on: ubuntu-latest
    outputs:
      product: ${{ steps.classify.outputs.product }}
      web_app: ${{ steps.classify.outputs.web_app }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Both ends of the diff are revisions of this history: a shallow
          # clone has neither.
          fetch-depth: 0

      - name: Does this change touch product code
        id: classify
        env:
          # Through the environment rather than into the script: an expression
          # interpolated into a shell line is a shell line somebody else can
          # write.
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -eu
          # The change's range, or none: a range this checkout cannot read is
          # not a diff, and the classifier reads an empty path list as "every
          # path counts as product".
          out="$RUNNER_TEMP/classification.txt"
          range=""
          if [ "$EVENT" = pull_request ]; then
            # The merge base with the branch being merged into, not GitHub's
            # synthetic merge: the change is what the branch added, not what
            # main did meanwhile.
            base=$(git merge-base "origin/$BASE_REF" "$HEAD_SHA" || true)
            if [ -n "$base" ]; then
              range="$base...$HEAD_SHA"
            else
              echo "no merge base of origin/$BASE_REF and $HEAD_SHA in this checkout: no diff to read, so every path counts as product" >&2
            fi
          elif [ -n "${BEFORE:-}" ] && git rev-parse -q --verify "$BEFORE^{commit}" >/dev/null 2>&1; then
            range="$BEFORE..$AFTER"
          else
            # A first push, a forced update or a shallow surprise leaves no
            # revision to diff against. What it changed is then unknowable, so
            # every path counts as product instead of none — and the reason is
            # said out loud, because this is the answer that runs everything.
            echo "BEFORE ${BEFORE:-<empty>} is not a commit in this checkout: no diff to read, so every path counts as product" >&2
          fi
          # One diff, one classifier, each on its own with its exit status read:
          # never a pipe, which would swallow a failure of either and let this
          # job pass with no answer at all.
          if [ -n "$range" ]; then
            echo "range: $range"
            scripts/ci-changed-paths.sh "$range" > "$out"
          else
            scripts/ci-product-paths.sh < /dev/null > "$out"
          fi
          cat "$out"
          # The verdict, checked to be exactly one and the last line, is what
          # GitHub wants in $GITHUB_OUTPUT. Anything else fails this step with
          # the reason: an output nobody set would skip ci-product as if the
          # change owed nothing.
          verdict=$(scripts/ci-verdict.sh "$out")
          echo "product output: $verdict"
          echo "$verdict" >> "$GITHUB_OUTPUT"
          scripts/ci-web-provenance-paths.sh < "$out" >> "$GITHUB_OUTPUT"

  # The product checks, as the one command a person runs before pushing. It is
  # skipped for a change that cannot touch product code and while a pull
  # request is a draft. A skipped job reports as a success to a required check
  # on GitHub, so requiring this job in branch protection does not block a
  # change that does not owe it.
  #
  # It is also fail-safe: it runs whenever the `changes` job did not succeed,
  # whatever that job may have answered. A failed `changes` job has no `product`
  # output, and a job skipped for a missing output reports the same success as a
  # change that owes nothing — an independent green `ci-backlog` could then let
  # a change merge that never ran typecheck, lint or the suite. Running the
  # checks is the safe reading of a missing answer, and it also means the
  # workflow cannot be made to skip them by breaking the classifier.
  # `!cancelled()` keeps a cancelled run from starting them, and a draft pull
  # request still skips them: that is this workflow's own decision, not a
  # missing answer. Branch protection requiring `changes` too is the other half
  # of the guarantee: a failed `changes` job is then a red required check.
  ci-product:
    timeout-minutes: 40
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.product == 'true') && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # The launcher, not the host: no `npm ci` here, no `node_modules` in this
      # checkout, and the checks and the suite never start in it. The daemon
      # behind the launcher is the disposable Docker daemon of this runner.
      - name: Typecheck, lint, the format check and the suite, inside the isolated test boundary
        run: node scripts/test-isolated.mjs check

  # Rebuild pinned shadcn add output and compare it with the kit registry lock.
  ci-shadcn-provenance:
    needs: changes
    if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft && needs.changes.outputs.web_app == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify pinned shadcn registry output
        run: scripts/shadcn-add.sh --check $(node -p "require('./web/kit/registry-lock/manifest.json').items.join(' ')")

  ci-backlog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The baseline is another revision of the tracked export and the
          # commit range needs the merge base, so the history has to be here.
          # A shallow clone has neither.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Lint expanding-only Postgres migrations with squawk
        run: |
          set -eu
          squawk="$RUNNER_TEMP/squawk"
          curl --proto '=https' --tlsv1.2 -fsSL \
            https://github.com/sbdchd/squawk/releases/download/v2.69.0/squawk-linux-x64 \
            -o "$squawk"
          printf '%s  %s\n' \
            9af8b2b54135ab236389122bce6c9edc40a8db4347e77d19079f19dcceddc737 \
            "$squawk" | sha256sum --check
          chmod +x "$squawk"
          "$squawk" db/migrations/*.sql

      - name: Product documents follow their form
        env:
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AFTER: ${{ github.sha }}
        run: |
          set -eu
          case "$EVENT" in
            pull_request) revision="$HEAD_SHA" ;;
            push) revision="$AFTER" ;;
            *) echo "unsupported event: $EVENT" >&2; exit 2 ;;
          esac
          [ -n "$revision" ] || { echo "missing product-document revision" >&2; exit 2; }
          node .backlog/rules/check-product.mjs --rev "$revision"

      - name: The backlog is still a queue
        env:
          # Through the environment rather than into the script: an expression
          # interpolated into a shell line is a shell line somebody else can
          # write.
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -eu
          gate=.backlog
          # The baseline: what was already wrong before this change. On a pull
          # request that is the merge base with the branch being merged into;
          # on a push to main it is the commit main was at before the push,
          # because a merge base against the branch's own upstream is the
          # branch itself. A first push or a shallow surprise leaves neither,
          # and then the previous commit is the honest answer.
          base=""
          if [ "$EVENT" = pull_request ]; then
            base=$(git merge-base "origin/$BASE_REF" "$HEAD_SHA")
          elif [ -n "${BEFORE:-}" ] && git rev-parse -q --verify "$BEFORE^{commit}" >/dev/null; then
            base="$BEFORE"
          fi
          if [ -z "$base" ] || [ "$(git rev-parse "$base^{commit}")" = "$(git rev-parse HEAD)" ]; then
            base=$(git rev-parse HEAD^)
          fi
          echo "baseline: $base"
          # The export at the head of the change: branches do not carry the
          # export (it is committed on main only), so the newest snapshot the
          # checked history reaches is the honest head. A change that removes
          # the export entirely is an input error, said as one.
          head_export=$(git rev-list -1 "${HEAD_SHA:-HEAD}" -- .beads/issues.jsonl 2>/dev/null \
            || git rev-list -1 HEAD -- .beads/issues.jsonl)
          [ -n "$head_export" ] || { echo "no .beads/issues.jsonl anywhere in this history" >&2; exit 2; }
          node "$gate/adapter.mjs" --at "$base" > "$RUNNER_TEMP/backlog-baseline.json" 2>/dev/null \
            || printf '{"generatedAt":"1970-01-01T00:00:00Z","source":"empty","issues":[]}' > "$RUNNER_TEMP/backlog-baseline.json"
          baseline_config=""
          if git show "$base:$gate/config.json" > "$RUNNER_TEMP/backlog-baseline-config.json" 2>/dev/null; then
            baseline_config="--baseline-config $RUNNER_TEMP/backlog-baseline-config.json"
          fi
          # shellcheck disable=SC2086 # baseline_config is two words or none
          node "$gate/adapter.mjs" --at "$head_export" |
            node "$gate/rules/check.mjs" \
              --config "$gate/config.json" \
              --baseline "$RUNNER_TEMP/backlog-baseline.json" $baseline_config -

      - name: Every new commit names a task
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -eu
          gate=.backlog
          # Every commit this change introduces, each checked on its own. On a
          # pull request that is the merge base to the PR's head — not HEAD,
          # which is GitHub's synthetic merge — and an empty range is an error,
          # never a pass. On a push to main it is the commits of the pushed tip
          # that no ref the remote already had reaches, past main's own "before"
          # when the push has one. Never a merge base with main itself.
          head_export=$(git rev-list -1 "${HEAD_SHA:-HEAD}" -- .beads/issues.jsonl 2>/dev/null \
            || git rev-list -1 HEAD -- .beads/issues.jsonl)
          [ -n "$head_export" ] || { echo "no .beads/issues.jsonl anywhere in this history" >&2; exit 2; }
          if [ "$EVENT" = pull_request ]; then
            range="$(git merge-base "origin/$BASE_REF" "$HEAD_SHA")..$HEAD_SHA"
            echo "range: $range"
            node "$gate/commits.mjs" --range "$range" --export-at "$head_export"
          else
            set -- --introduced "$(git rev-parse HEAD)" --by "$GITHUB_REF" --export-at "$head_export"
            if [ -n "${BEFORE:-}" ] && git rev-parse -q --verify "$BEFORE^{commit}" >/dev/null; then
              set -- "$@" --before "$BEFORE"
            fi
            echo "introduced by $GITHUB_REF at $(git rev-parse --short HEAD)"
            node "$gate/commits.mjs" "$@"
          fi

      - name: The documents that describe the present name paths that exist
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          gate=.backlog
          # From the merge base to the PR's head, not GitHub's synthetic merge,
          # as the commit check above.
          base=$(git merge-base "origin/$BASE_REF" "$HEAD_SHA")
          echo "base: $base"
          node "$gate/rules/check-present.mjs" --config "$gate/config.json" --base "$base" --head "$HEAD_SHA"

  # Build the standalone core image on pull requests without a write token.
  # The platform loader image is built in the release workflow.
  ci-core-image:
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'pull_request' && (needs.changes.result != 'success' || needs.changes.outputs.product == 'true') && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Build the standalone core image
        env:
          SHA: ${{ github.sha }}
        run: scripts/build-core-image.sh "ci-core-$SHA"

  # Publish the standalone core image on main. This is the only job that asks
  # for packages: write; it runs on every push, including documents-only pushes.
  ci-core-image-publish:
    if: ${{ !cancelled() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          set -eu
          printf '%s' "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
      - name: Build and publish the standalone core image
        env:
          SHA: ${{ github.sha }}
        run: |
          set -eu
          scripts/build-core-image.sh main "$SHA"
          docker push "ghcr.io/shady2k/lifemodel-core:main"
          docker push "ghcr.io/shady2k/lifemodel-core:$SHA"

  # Build the standalone web image on pull requests without a write token.
  ci-web-image:
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'pull_request' && (needs.changes.result != 'success' || needs.changes.outputs.product == 'true') && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build the standalone web image
        env:
          SHA: ${{ github.sha }}
        run: scripts/build-web-image.sh "ci-web-$SHA"

  # Publish the standalone web image on main.
  ci-web-image-publish:
    if: ${{ !cancelled() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Log in to GitHub Container Registry
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          set -eu
          printf '%s' "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
      - name: Build and publish the standalone web image
        env:
          SHA: ${{ github.sha }}
        run: |
          set -eu
          scripts/build-web-image.sh main "$SHA"
          docker push "ghcr.io/shady2k/lifemodel-web:main"
          docker push "ghcr.io/shady2k/lifemodel-web:$SHA"
