name: Release platform OCI artifact

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Check out the tagged source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Prepare the core image context
        run: scripts/prepare-core-image-context.sh .docker-core-context

      - name: Build and push core image
        id: core
        uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991 # v6.13.0
        with:
          context: .docker-core-context
          file: docker/core/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/lifemodel-core:${{ github.ref_name }}

      - name: Remove the temporary core build context
        if: always()
        run: rm -rf .docker-core-context

      - name: Pin the core image to its pushed digest in the seed source
        env:
          CORE_DIGEST: ${{ steps.core.outputs.digest }}
        run: scripts/release/set-core-digest.sh "$CORE_DIGEST" deploy/platform/applications/lifemodel/kustomization.yaml

      - name: Prepare the web image context
        run: scripts/prepare-web-image-context.sh .docker-web-context

      - name: Build and push web image
        id: web
        uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991 # v6.13.0
        with:
          context: .docker-web-context
          file: docker/web/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/lifemodel-web:${{ github.ref_name }}

      - name: Remove the temporary web build context
        if: always()
        run: rm -rf .docker-web-context

      - name: Pin the web image to its pushed digest in the seed source
        env:
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        run: scripts/release/set-web-digest.sh "$WEB_DIGEST" deploy/platform/applications/lifemodel/kustomization.yaml

      - name: Prepare the full-history loader seed bundle
        id: prepare-seed
        run: scripts/release/prepare-loader-context.sh

      - name: Build and push loader image
        id: loader
        uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991 # v6.13.0
        with:
          context: .
          file: docker/loader/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/lifemodel-loader:${{ github.ref_name }}

      - name: Remove the temporary loader build context
        if: always()
        run: rm -rf .docker-context

      - name: Pin the loader image to its pushed digest
        env:
          LOADER_DIGEST: ${{ steps.loader.outputs.digest }}
        run: scripts/release/set-loader-digest.sh "$LOADER_DIGEST" deploy/platform/a0/kustomization.yaml

      - name: Install Flux CLI v2.9.6
        uses: fluxcd/flux2/action@b9c17924adb533d3617ec7de97a7b0f4acc07b39 # v2.9.6
        with:
          version: '2.9.6'

      - name: Push the platform artifact
        id: platform
        working-directory: deploy/platform
        env:
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          flux push artifact "oci://ghcr.io/$OWNER/lifemodel-platform:$TAG" \
            --path . \
            --source "https://github.com/$REPOSITORY" \
            --revision "$TAG@sha1:$COMMIT" \
            --output json > "$RUNNER_TEMP/flux-push.json"
          cat "$RUNNER_TEMP/flux-push.json"
          digest="$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' "$RUNNER_TEMP/flux-push.json")"
          if [ -z "$digest" ]; then
            echo 'Flux did not report the pushed platform artifact digest' >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb # v3.8.2
        with:
          cosign-release: 'v2.4.1'

      - name: Sign the platform artifact by digest (keyless)
        env:
          OWNER: ${{ github.repository_owner }}
          DIGEST: ${{ steps.platform.outputs.digest }}
        run: cosign sign --yes "ghcr.io/$OWNER/lifemodel-platform@$DIGEST"

      - name: Verify the platform artifact signature
        env:
          OWNER: ${{ github.repository_owner }}
          DIGEST: ${{ steps.platform.outputs.digest }}
        run: >-
          cosign verify "ghcr.io/$OWNER/lifemodel-platform@$DIGEST"
          --certificate-oidc-issuer-regexp '^https://token\.actions\.githubusercontent\.com$'
          --certificate-identity-regexp '^https://github\.com/shady2k/lifemodel/\.github/workflows/release\.yml@refs/tags/v.*$'

      - name: Prepare and smoke-test the versioned installer bundle
        env:
          PLATFORM_DIGEST: ${{ steps.platform.outputs.digest }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          scripts/release/prepare-installer-bundle.sh "$TAG" "$PLATFORM_DIGEST" "$RUNNER_TEMP/installer-bundle"
          mkdir -p "$RUNNER_TEMP/clean"
          cp -R "$RUNNER_TEMP/installer-bundle/." "$RUNNER_TEMP/clean/"
          test -x "$RUNNER_TEMP/clean/scripts/install.sh"
          grep -F "PLATFORM_TAG=\"$TAG\"" "$RUNNER_TEMP/clean/scripts/install.sh"
          grep -F "PLATFORM_DIGEST=\"${PLATFORM_DIGEST#sha256:}\"" "$RUNNER_TEMP/clean/scripts/install.sh"
          (cd "$RUNNER_TEMP/clean" && sh scripts/install.sh --help >/dev/null)
          gh release upload "$TAG" "$RUNNER_TEMP/installer-bundle/scripts/install.sh" \
            "$RUNNER_TEMP/installer-bundle/deploy/root/ocirepository.yaml" \
            "$RUNNER_TEMP/installer-bundle/deploy/root/kustomization.yaml" \
            "$RUNNER_TEMP/installer-bundle/deploy/root/instance.yaml" \
            "$RUNNER_TEMP/installer-bundle/deploy/mdns/publish-name" \
            "$RUNNER_TEMP/installer-bundle/deploy/mdns/publisher.service.in" \
            "$RUNNER_TEMP/installer-bundle/deploy/cli/lifemodel.mjs" --clobber
