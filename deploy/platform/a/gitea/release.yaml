apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitea
  namespace: lifemodel-git
spec:
  interval: 10m0s
  timeout: 10m0s
  releaseName: gitea
  chart:
    spec:
      chart: ./charts/gitea
      version: 12.7.0
      interval: 10m0s
      sourceRef:
        kind: OCIRepository
        name: platform
        namespace: flux-system
  install:
    remediation:
      retries: 3
      remediateLastFailure: false
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: false
  valuesFrom:
    - kind: ConfigMap
      name: gitea-values
      valuesKey: values.yaml
