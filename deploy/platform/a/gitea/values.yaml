# Explicit ADR-010 R7-03 choices for the vendored Gitea 12.7.0 chart.
# The namespace enforces the Kubernetes restricted Pod Security Standard.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

postgresql-ha:
  enabled: false
postgresql:
  enabled: false
valkey-cluster:
  enabled: false
valkey:
  enabled: false

persistence:
  enabled: true
  create: true
  mount: true
  claimName: gitea-shared-storage
  size: 10Gi
  accessModes:
    - ReadWriteOnce
  storageClass: local-path
  annotations:
    helm.sh/resource-policy: keep
    kustomize.toolkit.fluxcd.io/prune: disabled

ingress:
  enabled: false

gitea:
  admin:
    username: ""
    password: ""
    existingSecret: gitea-admin
    passwordMode: initialOnlyNoReset
  config:
    database:
      DB_TYPE: sqlite3
      PATH: /data/gitea/gitea.db
    repository:
      ROOT: /data/git/repositories
    queue:
      TYPE: level
    cache:
      ADAPTER: memory
    server:
      DOMAIN: gitea-http.lifemodel-git.svc.cluster.local
      SSH_DOMAIN: gitea-http.lifemodel-git.svc.cluster.local
      ROOT_URL: http://gitea-http.lifemodel-git.svc.cluster.local:3000/
