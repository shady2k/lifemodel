apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - openbao-release.yaml
  - network-policy.yaml
configMapGenerator:
  - name: openbao-values
    namespace: openbao
    files:
      - values.yaml=openbao-values.yaml
generatorOptions:
  disableNameSuffixHash: true
