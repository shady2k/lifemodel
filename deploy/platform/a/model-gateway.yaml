apiVersion: v1
kind: Service
metadata:
  name: model-gateway
  namespace: lifemodel-system
spec:
  selector:
    app.kubernetes.io/name: model-gateway
  ports:
    # The OpenAI-compatible API the core talks to, and nothing else.
    - name: api
      port: 8080
      targetPort: api
      protocol: TCP
    # Task-only TLS model/identity listener (653.8.6), never the core API.
    - name: task
      port: 8446
      targetPort: 8446
      protocol: TCP
    # Health, on its own listener: NetworkPolicies are L3/L4, so /status is not
    # exposed on the API port (ADR-013 D5).
    - name: status
      port: 8081
      targetPort: status
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-gateway
  namespace: lifemodel-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: model-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: model-gateway
    spec:
      serviceAccountName: model-gateway
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: model-gateway
          # The loader's own image and its separate entry point: no generation
          # ever builds or changes the code that holds the key (ADR-013 D1).
          # Kustomize pins the pushed loader digest below, the same one A0 uses.
          image: ghcr.io/shady2k/lifemodel-loader:release-placeholder
          imagePullPolicy: IfNotPresent
          # The absolute path of the gateway's entry point, never the loader's
          # main.js (ADR-013 D8).
          command: ['node', '/opt/lifemodel/loader/dist/model-gateway.js']
          env:
            - name: LIFEMODEL_OPENBAO_ADDRESS
              value: http://openbao.openbao.svc:8200
          ports:
            - name: api
              containerPort: 8080
              protocol: TCP
            - name: status
              containerPort: 8081
              protocol: TCP
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          # Readiness is the process's own listeners: missing slots before
          # onboarding never make the gateway unready, so the wizard never
          # holds platform-a (ADR-013 D8).
          readinessProbe:
            httpGet:
              path: /status
              port: status
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /status
              port: status
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
