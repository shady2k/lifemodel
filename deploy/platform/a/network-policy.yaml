apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openbao-api-from-loader-only
  namespace: openbao
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openbao
      app.kubernetes.io/instance: openbao
      component: server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: lifemodel-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: loader
      ports:
        - protocol: TCP
          port: 8200
