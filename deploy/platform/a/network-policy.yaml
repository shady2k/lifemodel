apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openbao-default-deny
  namespace: openbao
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openbao-server-access
  namespace: openbao
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openbao
      app.kubernetes.io/instance: openbao
      component: server
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # The loader bootstraps Bao; the model gateway logs in with its own
    # ServiceAccount and reads the model slots (ADR-013 D3/D5); the storage
    # module logs in with its own ServiceAccount and reads the one SeaweedFS
    # custody record (ADR-015 S-D1).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: lifemodel-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: loader
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: lifemodel-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: model-gateway
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: lifemodel-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: storage-module
      ports:
        - protocol: TCP
          port: 8200
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 6443
---
# The model gateway's own routes (ADR-013 D5). It inherits nothing from the
# loader: the namespace default deny is separate, and this policy is the whole
# of what it may do.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: model-gateway-access
  namespace: lifemodel-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: model-gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # 8080 is the core's API: no other pod may call the model through it.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: lifemodel
          podSelector:
            matchLabels:
              app.kubernetes.io/name: core
      ports:
        - protocol: TCP
          port: 8080
    # /status is read by the web module and by the loader's settings.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: lifemodel
          podSelector:
            matchLabels:
              app.kubernetes.io/name: web
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: lifemodel-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: loader
      ports:
        - protocol: TCP
          port: 8081
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Its own login and the model slots it reads; never the loader's identity.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openbao
      ports:
        - protocol: TCP
          port: 8200
    # Canonical task intent, once-only claim and verified storage projection.
    # No SQL readiness dependency: the database arrives later, in C.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: lifemodel-state
          podSelector:
            matchLabels:
              cnpg.io/cluster: lifemodel
      ports:
        - protocol: TCP
          port: 5432
    # Live TokenReview + exact Pod/Job GETs. k3s API Service DNAT reaches an
    # unknown node address; RBAC bounds this API-audience service-account token.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 6443
    # The loader's model exception: the owner's endpoints may be public or on
    # the RFC 1918 LAN, while pod, service and link-local ranges stay refused.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.42.0.0/16
              - 10.43.0.0/16
              - 169.254.0.0/16
      # No port restriction: owner endpoints may use LAN Ollama 11434 or custom HTTPS ports.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ollama
      ports:
        - protocol: TCP
          port: 11434

---
# SeaweedFS (ADR-015 S-D1). Only the storage module reaches it, and only on the
# S3 port: the master, volume and filer ports have no allow rule at all, so the
# namespace default deny alone is what keeps them private to this pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: seaweedfs-access
  namespace: lifemodel-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: lifemodel-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: storage-module
      ports:
        - protocol: TCP
          port: 8333
  egress:
    # Nothing in the cluster is allowed to answer it, and it reaches nothing:
    # its components talk over loopback inside its own pod.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
