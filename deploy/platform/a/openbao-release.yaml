apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao
  namespace: openbao
spec:
  interval: 10m0s
  timeout: 10m0s
  releaseName: openbao
  chart:
    spec:
      chart: ./charts/openbao
      version: 0.30.3
      interval: 10m0s
      sourceRef:
        kind: OCIRepository
        name: platform
        namespace: flux-system
  install:
    remediation:
      retries: 3
      remediateLastFailure: false
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: false
  valuesFrom:
    - kind: ConfigMap
      name: openbao-values
      valuesKey: values.yaml
