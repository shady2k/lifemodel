# The SeaweedFS S3 identity file (ADR-015 S-D1).
#
# Trusted bootstrap writes it: the loader generates the module's service
# credentials, keeps them in the OpenBao custody record
# `lifemodel/data/storage/seaweed`, and projects them here as the identity file
# only this pod mounts. No caller, generation, task, core or web holds them.
#
# The platform creates the Secret empty and Flux never overwrites it
# (`IfNotPresent`), so the loader's content survives every reconcile. A missing
# or unreadable identity file stops the process; a file that yields no identity
# denies every request, never serving anonymously. TCP probes do not prove S3
# authentication; the storage module checks the bucket with signed requests.
apiVersion: v1
kind: Secret
metadata:
  name: seaweed-s3-identity
  namespace: lifemodel-system
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
data:
  s3.json: ''
