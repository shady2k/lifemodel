# SeaweedFS for the platform storage module (ADR-015 S-D1, S-D7).
#
# One `weed mini` process: master, volume server, filer and S3 in a single
# container, on one retained volume. It is not a chart and it is not the
# image's default entrypoint: the flags are explicit, every service the
# platform does not need is disabled, and S3 authentication is required.
#
# Why a StatefulSet: one writer, one volume, and a rollout that never has two
# pods on the claim. `persistentVolumeClaimRetentionPolicy: Retain` keeps the
# data when the pod or the StatefulSet is deleted.
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: lifemodel-system
spec:
  selector:
    app.kubernetes.io/name: seaweedfs
  ports:
    # The S3 API is the only port anything outside this pod may reach. The
    # master, volume and filer ports stay private to the process (ADR-015 S-D1).
    - name: s3
      port: 8333
      targetPort: s3
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs
  namespace: lifemodel-system
spec:
  replicas: 1
  serviceName: seaweedfs
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seaweedfs
    spec:
      # SeaweedFS never calls the Kubernetes API: it gets no token.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seaweedfs
          # The research pin (docs/research/task-runtime.md 3.3): 4.48 by
          # digest. Never a tag, never `latest`.
          image: chrislusf/seaweedfs@sha256:aba492e2a4e4c90bff795745e8e660affa1f09e7650f5981bd7bccd1a06cd931
          imagePullPolicy: IfNotPresent
          # The image's own entrypoint fixes volume ownership as root and then
          # drops privileges; the restricted policy forbids that, so the
          # process is started directly as the image's `seaweed` user (1000).
          command: ['/usr/bin/weed']
          args:
            - -logtostderr=true
            - mini
            # Data, filer metadata and the mini configuration file all live
            # under this one directory, on the claim below.
            - -dir=/data
            # Components talk to each other over loopback, so the pod network
            # carries only the S3 port. Nothing else in the cluster can reach
            # the master, volume or filer ports (NetworkPolicy below).
            - -ip=127.0.0.1
            - -ip.bind=0.0.0.0
            - -master.port=9333
            - -volume.port=9340
            - -filer.port=8888
            # S3: the one API the storage module speaks, with authentication
            # required. `-s3.config` makes SeaweedFS enforce auth even when the
            # file yields no identity, and a missing or unreadable file stops
            # the process: there is no anonymous mode.
            - -s3=true
            - -s3.port=8333
            - -s3.config=/etc/seaweedfs/s3.json
            # No embedded IAM API: one static service identity is the whole of
            # the module's authority, and no caller may change it.
            - -s3.iam=false
            # The module's one bucket, created on startup when absent.
            - -bucket=lifemodel-storage
            # Disabled: the admin UI, WebDAV and the table catalogs.
            - -admin.ui=false
            - -webdav=false
            - -s3.port.iceberg=0
            - -s3.port.lance=0
            # No telemetry leaves the instance.
            - -master.telemetry=false
          ports:
            - name: s3
              containerPort: 8333
              protocol: TCP
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          # Readiness: the S3 listener answers. The module's own readiness is
          # the authenticated check: this one only says the process is serving.
          readinessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: '1', memory: 1Gi }
          volumeMounts:
            - name: data
              mountPath: /data
            # Only this pod mounts the S3 identity file. subPath keeps the
            # image's own /etc/seaweedfs contents (filer.toml) visible.
            - name: s3-identity
              mountPath: /etc/seaweedfs/s3.json
              subPath: s3.json
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: s3-identity
          secret:
            secretName: seaweed-s3-identity
            # 0400 read-only for the container's user; spelled in decimal
            # because YAML 1.1 reads a leading zero as octal.
            defaultMode: 256
        # SeaweedFS keeps its local gRPC sockets here.
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
