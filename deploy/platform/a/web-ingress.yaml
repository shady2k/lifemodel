apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: loader-auth
  namespace: lifemodel
spec:
  forwardAuth:
    address: http://loader.lifemodel-system.svc.cluster.local:7000/_auth/verify
    trustForwardHeader: false
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-auth-handoff
  namespace: lifemodel
  annotations:
    traefik.ingress.kubernetes.io/router.priority: '200'
spec:
  ingressClassName: traefik
  rules:
    - host: localhost
      http:
        paths:
          - path: /_auth/handoff
            pathType: Exact
            backend:
              service:
                name: loader
                port:
                  number: 7000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-private
  namespace: lifemodel
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: lifemodel-loader-auth@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 8080
