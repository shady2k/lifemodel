# Inherits lifemodel-system-default-deny from A0. The registry initiates no
# network calls. Only the loader can push (zot authenticates that identity).
# Core may anonymously HEAD the pinned manifest before accepting a task;
# no unrelated pod receives even anonymous pull.
# Node-origin kubelet/containerd pulls and probes are exempt from ingress
# isolation on this sole node under Kubernetes NetworkPolicy semantics; do not
# add a broad ipBlock rule to imitate that implicit node exemption.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zot-access
  namespace: lifemodel-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: zot
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: lifemodel-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: loader
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: lifemodel
          podSelector:
            matchLabels:
              app.kubernetes.io/name: core
        # Future pwe builder: add its explicit namespace AND pod selector here
        # with a separately scoped registry identity; never a namespace wildcard.
      ports:
        - protocol: TCP
          port: 5001
  egress: []
