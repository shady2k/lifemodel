# Kubernetes ValidatingAdmissionPolicy CEL reference: https://kubernetes.io/docs/reference/access-authn-authz/validating-admission-policy/
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: loader-secret-admission
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: [lifemodel-git, lifemodel, lifemodel-motor, lifemodel-state]
    resourceRules:
      - apiGroups: ['']
        apiVersions: [v1]
        operations: [CREATE, UPDATE, DELETE]
        resources: [secrets]
  matchConditions:
    - name: loader-identity
      expression: request.userInfo.username == 'system:serviceaccount:lifemodel-system:loader'
  validations:
    - expression: >-
        request.operation != 'DELETE' &&
        ((request.namespace == 'lifemodel-git' && object.metadata.name == 'gitea-admin') ||
         (request.namespace == 'lifemodel' && request.operation == 'UPDATE' && object.metadata.name == 'core-task-channel-tls') ||
         ((request.namespace == 'lifemodel' && (object.metadata.name == 'deploy-source-credential' || object.metadata.name == 'lifemodel-db-credentials' || object.metadata.name == 'lifemodel-valkey-credentials')) || (request.namespace == 'lifemodel-motor' && object.metadata.name == 'deploy-source-credential') || (request.namespace == 'lifemodel-state' && (object.metadata.name == 'lifemodel-valkey-credentials' || object.metadata.name == 'lifemodel-capture-credentials'))))
      message: loader may only create or update named bootstrap and store credential Secrets, or update the existing core task TLS Secret; deletion is forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: loader-secret-admission
spec:
  policyName: loader-secret-admission
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: loader-configmap-admission
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: [lifemodel, lifemodel-motor, lifemodel-system]
    resourceRules:
      - apiGroups: ['']
        apiVersions: [v1]
        operations: [CREATE, UPDATE, DELETE]
        resources: [configmaps]
  matchConditions:
    - name: loader-identity
      expression: request.userInfo.username == 'system:serviceaccount:lifemodel-system:loader'
  validations:
    - expression: >-
        request.operation != 'DELETE' &&
        ((request.namespace == 'lifemodel' &&
          object.metadata.name == 'lifemodel-platform-settings') ||
         (request.namespace in ['lifemodel', 'lifemodel-motor'] &&
          request.operation == 'UPDATE' && object.metadata.name == 'lifemodel-ca' &&
          has(object.data) && size(object.data) == 1 && 'ca.crt' in object.data &&
          !has(object.binaryData)) ||
         (request.namespace == 'lifemodel-system' &&
          (object.metadata.name in ['lifemodel-storage-settings', 'lifemodel-logs-settings'] ||
           (request.operation == 'UPDATE' && object.metadata.name in ['lifemodel-ca', 'lifemodel-pki-status']))))
      message: loader may only create or update the named settings projections or update its existing PKI ConfigMaps; deletion is forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: loader-configmap-admission
spec:
  policyName: loader-configmap-admission
  validationActions: [Deny]
---
# Exclusive ownership of the authoritative settings projections: the exact
# resources are reserved for the loader against every requester, so no other
# identity with ConfigMap write RBAC (an operator's service account, for
# instance) can create, update or delete one. Unrelated ConfigMaps never match.
# The log store keeps the owner's retention setting in the second projection.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: platform-settings-ownership-admission
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: [lifemodel, lifemodel-motor, lifemodel-system]
    resourceRules:
      - apiGroups: ['']
        apiVersions: [v1]
        operations: [CREATE, UPDATE, DELETE]
        resources: [configmaps]
  matchConditions:
    - name: platform-settings-resource
      # request.name, not the (absent on DELETE) new object.
      expression: >-
        (request.namespace == 'lifemodel' && request.name == 'lifemodel-platform-settings') ||
        (request.namespace == 'lifemodel-system' && request.name in ['lifemodel-storage-settings', 'lifemodel-logs-settings'])
  validations:
    - expression: request.userInfo.username == 'system:serviceaccount:lifemodel-system:loader'
      message: only the loader may create, update or delete the platform settings ConfigMaps
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: platform-settings-ownership-admission
spec:
  policyName: platform-settings-ownership-admission
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: application-kustomization-admission
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: [lifemodel, lifemodel-motor]
    resourceRules:
      - apiGroups: [kustomize.toolkit.fluxcd.io]
        apiVersions: [v1]
        operations: [CREATE, UPDATE, DELETE]
        resources: [kustomizations]
  validations:
    - expression: >-
        request.operation == 'DELETE' ||
        (has(object.spec.serviceAccountName) && object.spec.serviceAccountName == request.namespace + '-applier' &&
         has(object.spec.sourceRef) && object.spec.sourceRef.kind == 'GitRepository' &&
         object.spec.sourceRef.name == request.namespace &&
         (!has(object.spec.sourceRef.namespace) || object.spec.sourceRef.namespace == request.namespace) &&
         !has(object.spec.kubeConfig) &&
         has(object.spec.targetNamespace) && object.spec.targetNamespace == request.namespace &&
         (!has(object.spec.dependsOn) || object.spec.dependsOn.all(dependency, !has(dependency.namespace) || dependency.namespace == request.namespace)))
      message: application Kustomizations must use their local GitRepository and applier
    - expression: >-
        request.userInfo.username != 'system:serviceaccount:lifemodel-system:loader' ||
        (request.operation != 'DELETE' &&
         has(object.metadata.name) && object.metadata.name == request.namespace &&
         has(object.spec.path) && object.spec.path == './deploy/platform/applications/' + request.namespace)
      message: loader may only create or update the namespace's pinned application Kustomization
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: application-kustomization-admission
spec:
  policyName: application-kustomization-admission
  validationActions: [Deny]
---
# The log store's Deployment is the loader's to restart for a retention change
# or a partition key it wrote, and for nothing else (ADR-016 §5, N6). Either
# template annotation - the settings revision or the partition key revision,
# which is a separate value and never the key - makes `Recreate` replace the
# store's pod. The clamp compares the whole object, not a list of named fields:
# every key of the object's metadata, of the spec, of the pod template and of
# its metadata must hold the same value as in `oldObject`, and every key of the
# two annotation maps except the two revision keys must too. Only
# `metadata.resourceVersion`, `managedFields` and `generation`, which the
# apiserver rewrites, and `status` are left out, so a merge patch that carried
# `spec.paused`, an unlisted spec field or another annotation key beside the
# revision is refused. An annotation that reaches one map without the other, or
# disagrees between them, is refused too; a store that never had annotations
# takes the first one.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: loader-logs-store-deployment-admission
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: [lifemodel-system]
    resourceRules:
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [UPDATE]
        resources: [deployments]
  matchConditions:
    - name: loader-identity
      expression: request.userInfo.username == 'system:serviceaccount:lifemodel-system:loader'
    - name: logs-store
      expression: request.namespace == 'lifemodel-system' && request.name == 'logs-store'
  validations:
    - expression: >-
        object.apiVersion == oldObject.apiVersion &&
        object.kind == oldObject.kind &&
        has(object.metadata.annotations) &&
        has(object.spec.template.metadata.annotations) &&
        object.metadata.all(k,
          k in ['annotations', 'generation', 'resourceVersion', 'managedFields'] || (k in oldObject.metadata && object.metadata[k] == oldObject.metadata[k])) &&
        oldObject.metadata.all(k,
          k in ['annotations', 'generation', 'resourceVersion', 'managedFields'] || (k in object.metadata && object.metadata[k] == oldObject.metadata[k])) &&
        object.metadata.annotations.all(k,
          k in ['lifemodel.dev/logs-settings-revision', 'lifemodel.dev/logs-partition-key-revision'] || (has(oldObject.metadata.annotations) && k in oldObject.metadata.annotations && object.metadata.annotations[k] == oldObject.metadata.annotations[k])) &&
        (!has(oldObject.metadata.annotations) || oldObject.metadata.annotations.all(k,
          k in ['lifemodel.dev/logs-settings-revision', 'lifemodel.dev/logs-partition-key-revision'] || (k in object.metadata.annotations && oldObject.metadata.annotations[k] == object.metadata.annotations[k]))) &&
        object.spec.template.metadata.annotations.all(k,
          k in ['lifemodel.dev/logs-settings-revision', 'lifemodel.dev/logs-partition-key-revision'] || (has(oldObject.spec.template.metadata.annotations) && k in oldObject.spec.template.metadata.annotations && object.spec.template.metadata.annotations[k] == oldObject.spec.template.metadata.annotations[k])) &&
        (!has(oldObject.spec.template.metadata.annotations) || oldObject.spec.template.metadata.annotations.all(k,
          k in ['lifemodel.dev/logs-settings-revision', 'lifemodel.dev/logs-partition-key-revision'] || (k in object.spec.template.metadata.annotations && oldObject.spec.template.metadata.annotations[k] == object.spec.template.metadata.annotations[k]))) &&
        object.spec.all(k, k == 'template' || (k in oldObject.spec && object.spec[k] == oldObject.spec[k])) &&
        oldObject.spec.all(k, k == 'template' || (k in object.spec && oldObject.spec[k] == object.spec[k])) &&
        object.spec.template.all(k, k == 'metadata' || (k in oldObject.spec.template && object.spec.template[k] == oldObject.spec.template[k])) &&
        oldObject.spec.template.all(k, k == 'metadata' || (k in object.spec.template && oldObject.spec.template[k] == object.spec.template[k])) &&
        object.spec.template.metadata.all(k, k == 'annotations' || (k in oldObject.spec.template.metadata && object.spec.template.metadata[k] == oldObject.spec.template.metadata[k])) &&
        oldObject.spec.template.metadata.all(k, k == 'annotations' || (k in object.spec.template.metadata && oldObject.spec.template.metadata[k] == object.spec.template.metadata[k])) &&
        (('lifemodel.dev/logs-settings-revision' in object.metadata.annotations) == ('lifemodel.dev/logs-settings-revision' in object.spec.template.metadata.annotations)) &&
        (('lifemodel.dev/logs-partition-key-revision' in object.metadata.annotations) == ('lifemodel.dev/logs-partition-key-revision' in object.spec.template.metadata.annotations)) &&
        (('lifemodel.dev/logs-settings-revision' in object.metadata.annotations) || ('lifemodel.dev/logs-partition-key-revision' in object.metadata.annotations)) &&
        (!('lifemodel.dev/logs-settings-revision' in object.metadata.annotations) || (object.metadata.annotations['lifemodel.dev/logs-settings-revision'] ==
          object.spec.template.metadata.annotations['lifemodel.dev/logs-settings-revision'])) &&
        (!('lifemodel.dev/logs-partition-key-revision' in object.metadata.annotations) || (object.metadata.annotations['lifemodel.dev/logs-partition-key-revision'] ==
          object.spec.template.metadata.annotations['lifemodel.dev/logs-partition-key-revision']))
      message: the loader may only patch the logs settings and partition key revision annotations on the logs-store Deployment
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: loader-logs-store-deployment-admission
spec:
  policyName: loader-logs-store-deployment-admission
  validationActions: [Deny]
---
# Flux may CREATE the A0 public-CA placeholders in core and motor. Only loader
# can UPDATE them afterwards; nobody may DELETE them. The loader ConfigMap
# clamp above also rejects keys and binaryData. request.name covers DELETE.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: storage-ca-ownership-admission
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: [lifemodel, lifemodel-motor]
    resourceRules:
      - apiGroups: ['']
        apiVersions: [v1]
        operations: [UPDATE, DELETE]
        resources: [configmaps]
  matchConditions:
    - name: storage-ca-resource
      expression: request.namespace in ['lifemodel', 'lifemodel-motor'] && request.name == 'lifemodel-ca'
  validations:
    - expression: request.operation == 'UPDATE' && request.userInfo.username == 'system:serviceaccount:lifemodel-system:loader'
      message: only loader may update the core and task public CA ConfigMaps; deletion is forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: storage-ca-ownership-admission
spec:
  policyName: storage-ca-ownership-admission
  validationActions: [Deny]
