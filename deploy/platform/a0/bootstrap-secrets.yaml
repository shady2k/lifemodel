# Flux v2.9.6 (kustomize-controller v1.9.6) apply-policy docs:
# https://github.com/fluxcd/kustomize-controller/blob/v1.9.6/docs/spec/v1/kustomizations.md#controlling-the-apply-behavior-of-resources
# IfNotPresent only applies when absent (SSA policy):
# https://github.com/fluxcd/kustomize-controller/blob/v1.9.6/docs/spec/v1/kustomizations.md#kustomizetoolkitfluxcdiossa
# prune: disabled skips garbage collection (prune policy):
# https://github.com/fluxcd/kustomize-controller/blob/v1.9.6/docs/spec/v1/kustomizations.md#kustomizetoolkitfluxcdioprune
apiVersion: v1
kind: Secret
metadata:
  name: loader-bootstrap-state
  namespace: lifemodel-system
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: openbao-unseal-custody
  namespace: lifemodel-system
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: lifemodel-tls
  namespace: lifemodel-system
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
    kustomize.toolkit.fluxcd.io/prune: disabled
type: kubernetes.io/tls
data:
  tls.crt: ''
  tls.key: ''
---
# The instance-CA leaf of the storage module's task listener (ADR-015 S-D1): a
# second CA-issued certificate, for in-cluster names only, in its own Secret so
# the module's pod mounts nothing of the loader's.
apiVersion: v1
kind: Secret
metadata:
  name: storage-module-tls
  namespace: lifemodel-system
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
    kustomize.toolkit.fluxcd.io/prune: disabled
type: kubernetes.io/tls
data:
  tls.crt: ''
  tls.key: ''
---
# The storage module's database login, copied from CloudNativePG's generated
# `lifemodel-app` Secret by the loader's first start. A placeholder here means
# the loader only ever updates a Secret this platform created; the pod that
# mounts it starts once the copy exists.
apiVersion: v1
kind: Secret
metadata:
  name: storage-module-db-credentials
  namespace: lifemodel-system
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
