apiVersion: apps/v1
kind: Deployment
metadata:
  name: loader
  namespace: lifemodel-system
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loader
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loader
    spec:
      serviceAccountName: loader
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loader
          image: ghcr.io/shady2k/lifemodel-loader:release-placeholder
          imagePullPolicy: IfNotPresent
          env:
            - name: LIFEMODEL_NAME
              valueFrom:
                configMapKeyRef:
                  name: lifemodel-instance
                  key: LIFEMODEL_NAME
          ports:
            - name: http
              containerPort: 7000
              protocol: TCP
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            httpGet:
              path: /login
              port: http
              httpHeaders:
                - name: Host
                  value: boot-lifemodel.local
          livenessProbe:
            httpGet:
              path: /login
              port: http
              httpHeaders:
                - name: Host
                  value: boot-lifemodel.local
          volumeMounts:
            - name: state
              mountPath: /var/lib/loader
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: loader-state
        - name: tmp
          emptyDir: {}
