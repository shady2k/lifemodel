apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: loader
  namespace: lifemodel-system
spec:
  ingressClassName: traefik
  rules:
    - host: boot.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: loader
                port:
                  number: 7000
