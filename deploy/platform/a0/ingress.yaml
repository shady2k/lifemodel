apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: loader-auth
  namespace: lifemodel-system
spec:
  forwardAuth:
    address: http://loader.lifemodel-system.svc.cluster.local:7000/_auth/verify
    trustForwardHeader: false
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: loader-public
  namespace: lifemodel-system
  annotations:
    traefik.ingress.kubernetes.io/router.priority: '100'
spec:
  ingressClassName: traefik
  rules:
    - host: boot.localhost
      http:
        paths:
          - path: /login
            pathType: Exact
            backend:
              service:
                name: loader
                port:
                  number: 7000
          - path: /setup
            pathType: Exact
            backend:
              service:
                name: loader
                port:
                  number: 7000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: loader-private
  namespace: lifemodel-system
  annotations:
    traefik.ingress.kubernetes.io/router.priority: '10'
    traefik.ingress.kubernetes.io/router.middlewares: lifemodel-system-loader-auth@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: boot.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: loader
                port:
                  number: 7000
