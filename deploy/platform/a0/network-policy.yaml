apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loader-default-deny
  namespace: lifemodel-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 7000
  egress:
    # CoreDNS for openbao.openbao.svc; kube-dns label is used by k3s.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # k3s DNATs the in-cluster API Service to the node address; static platform
    # manifests cannot know that address. Allow any destination on TCP 6443:
    # The API port is the only egress restriction. The Kubernetes API server authenticates the projected ServiceAccount token.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 6443
    # OpenBao is the only permitted application service egress.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openbao
      ports:
        - protocol: TCP
          port: 8200

    # Model checks may reach public endpoints and RFC1918 LAN Ollama; application validation blocks pod/service and metadata ranges.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.42.0.0/16
              - 10.43.0.0/16
              - 169.254.0.0/16
    # No port restriction: owner endpoints may use LAN Ollama 11434 or custom HTTPS ports.
    # The one approved in-cluster Ollama destination.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ollama
      ports:
        - protocol: TCP
          port: 11434

    # The platform loader's only Gitea route: its HTTP API and Git over HTTP.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: lifemodel-git
          podSelector:
            matchLabels:
              app.kubernetes.io/name: gitea
              app.kubernetes.io/instance: gitea
      ports:
        - protocol: TCP
          port: 3000
