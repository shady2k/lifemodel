apiVersion: v1
kind: ServiceAccount
metadata:
  name: loader
  namespace: lifemodel-system
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: loader-bootstrap
  namespace: lifemodel-system
rules:
  - apiGroups: ['']
    resources: ['secrets']
    resourceNames:
      - loader-bootstrap-state
      - openbao-unseal-custody
      - lifemodel-tls
    verbs: ['get', 'update']
  - apiGroups: ['']
    resources: ['configmaps']
    resourceNames:
      - lifemodel-ca
    verbs: ['get', 'update']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: loader-bootstrap
  namespace: lifemodel-system
subjects:
  - kind: ServiceAccount
    name: loader
    namespace: lifemodel-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: loader-bootstrap
