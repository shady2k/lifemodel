apiVersion: v1
kind: ServiceAccount
metadata:
  name: loader
  namespace: lifemodel-system
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: loader-bootstrap
  namespace: lifemodel-system
rules:
  - apiGroups: ['']
    resources: ['secrets']
    resourceNames:
      - zot-htpasswd
      - loader-bootstrap-state
      - openbao-unseal-custody
      - lifemodel-tls
      # The storage module's own leaf and database login (ADR-015 S-D1): the
      # module's pod mounts both, and no other identity may write them.
      - storage-module-tls
      - storage-module-db-credentials
      # Dedicated gateway task leaf/login, never the loader or storage keys.
      - model-gateway-task-tls
      - model-gateway-db-credentials
    verbs: ['get', 'update']
  - apiGroups: ['networking.k8s.io']
    resources: ['networkpolicies']
    resourceNames: ['workbench-import-origin-egress']
    verbs: ['get', 'update']
  - apiGroups: ['']
    resources: ['configmaps']
    resourceNames:
      - lifemodel-ca
      - lifemodel-pki-status
    verbs: ['get', 'update']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: loader-bootstrap
  namespace: lifemodel-system
subjects:
  - kind: ServiceAccount
    name: loader
    namespace: lifemodel-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: loader-bootstrap
---
# No create, delete, list or Secret access: only the precreated public CA.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: loader-core-ca
  namespace: lifemodel
rules:
  - apiGroups: ['']
    resources: ['configmaps']
    resourceNames: ['lifemodel-ca']
    verbs: ['get', 'update']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: loader-core-ca
  namespace: lifemodel
subjects:
  - kind: ServiceAccount
    name: loader
    namespace: lifemodel-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: loader-core-ca
---
# Core's server leaf is distinct from the public CA projection. Only its
# precreated Secret may be read/updated; no create, list or delete grant.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: loader-core-task-channel-tls
  namespace: lifemodel
rules:
  - apiGroups: ['']
    resources: ['secrets']
    resourceNames: ['core-task-channel-tls']
    verbs: ['get', 'update']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: loader-core-task-channel-tls
  namespace: lifemodel
subjects:
  - kind: ServiceAccount
    name: loader
    namespace: lifemodel-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: loader-core-task-channel-tls
---
# Tasks receive trust only. PKI readiness needs this fixed-name grant in A0,
# not step A; no create, delete, list or Secret rights cross into motor.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: loader-motor-ca
  namespace: lifemodel-motor
rules:
  - apiGroups: ['']
    resources: ['configmaps']
    resourceNames: ['lifemodel-ca']
    verbs: ['get', 'update']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: loader-motor-ca
  namespace: lifemodel-motor
subjects:
  - kind: ServiceAccount
    name: loader
    namespace: lifemodel-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: loader-motor-ca
