apiVersion: v1
kind: ServiceAccount
metadata:
  name: core
  namespace: lifemodel
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: core
  namespace: lifemodel
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: core
  ports:
    - name: health
      port: 8081
      targetPort: health
    # Task-only TLS control stream (653.8.8); not the health listener.
    - name: task-channel
      port: 8447
      targetPort: 8447
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: core
  namespace: lifemodel
spec:
  serviceName: core
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: core
  template:
    metadata:
      labels:
        app.kubernetes.io/name: core
    spec:
      priorityClassName: lifemodel-core
      serviceAccountName: core
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: ghcr.io/shady2k/lifemodel-core:main
          command: ['/usr/local/bin/lifemodel-core-entrypoint', 'migrate']
          env:
            - name: LIFEMODEL_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: lifemodel-db-credentials
                  key: username
            - name: LIFEMODEL_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lifemodel-db-credentials
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: 1, memory: 2Gi }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: core
          image: ghcr.io/shady2k/lifemodel-core:main
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
          env:
            - name: LIFEMODEL_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: lifemodel-db-credentials
                  key: username
            - name: LIFEMODEL_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lifemodel-db-credentials
                  key: password
            - name: LIFEMODEL_VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lifemodel-valkey-credentials
                  key: password
            - name: LIFEMODEL_CORE_HEALTH_PORT
              value: '8081'
            - name: LIFEMODEL_CORE_STOP_DEADLINE_MS
              value: '5000'
            - name: MOTOR_CORTEX_ENABLED
              value: 'false'
            # Service-audience identities, never Kubernetes API credentials.
            - name: LIFEMODEL_STORAGE_CONTROL_TOKEN_FILE
              value: /var/run/secrets/lifemodel-storage/control-token
            - name: LIFEMODEL_STORAGE_CONTROL_CA_FILE
              value: /var/run/secrets/lifemodel-storage-ca/ca.crt
            - name: LIFEMODEL_STORAGE_READ_TOKEN_FILE
              value: /var/run/secrets/lifemodel-storage/read-token
            # The platform pins the model endpoint to its own gateway (ADR-013
            # D2/D7): the core holds no key, and this value overrides
            # core.settings and cannot be edited there.
            - name: LIFEMODEL_MODEL_BASE_URL
              value: http://model-gateway.lifemodel-system.svc:8080/v1
            - name: LIFEMODEL_MODEL_DIR
              value: /opt/model-cache
          startupProbe:
            httpGet: { path: /healthz, port: health }
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /healthz, port: health }
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet: { path: /healthz, port: health }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: { cpu: 750m, memory: 1536Mi }
            limits: { cpu: 1500m, memory: 3Gi }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # The loader's platform settings projection (ADR-014 D6): read
            # -only, so the core reads the owner's values and can never write
            # them; its task-launch API token has no ConfigMap RBAC.
            - name: platform-settings
              mountPath: /opt/lifemodel/platform-settings
              readOnly: true
            # No subPath: kubelet rotates these bound service-audience tokens.
            - name: storage-identity
              mountPath: /var/run/secrets/lifemodel-storage
              readOnly: true
            # Only the core process, never its migration init container, gets
            # a rotating API token for the namespaced task launcher Role.
            - name: task-api-identity
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            # Public instance CA only, never a TLS Secret or private key.
            - name: storage-ca
              mountPath: /var/run/secrets/lifemodel-storage-ca
              readOnly: true
      volumes:
        # Omitted audience deliberately requests the API-server audience.
        # automount stays false; service-specific storage tokens stay separate.
        - name: task-api-identity
          projected:
            defaultMode: 288
            sources:
              - serviceAccountToken:
                  expirationSeconds: 3600
                  path: token
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
        - name: storage-ca
          configMap:
            name: lifemodel-ca
            # Missing projection never blocks core startup. The storage
            # control client fails closed and retries until ca.crt appears.
            optional: true
            items:
              - key: ca.crt
                path: ca.crt
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
        # Optional: the core boots on the declarations' defaults before the
        # loader first projects the ConfigMap; the kubelet refreshes the
        # volume, so a change needs no core restart.
        - name: platform-settings
          configMap:
            name: lifemodel-platform-settings
            optional: true
        # Only service-specific audiences are projected; default API-audience
        # automount stays disabled on both the Pod and its ServiceAccount.
        - name: storage-identity
          projected:
            defaultMode: 288
            sources:
              - serviceAccountToken:
                  audience: lifemodel-core-storage-control
                  expirationSeconds: 3600
                  path: control-token
              - serviceAccountToken:
                  audience: lifemodel-core-storage-read
                  expirationSeconds: 3600
                  path: read-token
