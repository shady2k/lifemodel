apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: lifemodel
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: lifemodel
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/shady2k/lifemodel-web
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: internal
              containerPort: 8081
              protocol: TCP
          env:
            - name: LIFEMODEL_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: lifemodel-db-credentials
                  key: username
            - name: LIFEMODEL_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lifemodel-db-credentials
                  key: password
            - name: LIFEMODEL_VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lifemodel-valkey-credentials
                  key: password
            - name: LIFEMODEL_NAME
              valueFrom:
                configMapKeyRef:
                  name: lifemodel-instance
                  key: LIFEMODEL_NAME
            - name: LIFEMODEL_WEB_ALLOWED_ORIGIN
              value: https://$(LIFEMODEL_NAME).local
            - name: LIFEMODEL_WEB_PORT
              value: '8080'
            - name: LIFEMODEL_WEB_INTERNAL_PORT
              value: '8081'
            - name: LIFEMODEL_WEB_APP_DIRECTORY
              value: /opt/lifemodel/web/app
            - name: LIFEMODEL_VALKEY_URL
              value: redis://:$(LIFEMODEL_VALKEY_PASSWORD)@valkey.lifemodel-state.svc.cluster.local:6379
            - name: LIFEMODEL_DATABASE_URL
              value: postgres://$(LIFEMODEL_DB_USERNAME):$(LIFEMODEL_DB_PASSWORD)@lifemodel-rw.lifemodel-state.svc.cluster.local:5432/lifemodel
          readinessProbe:
            httpGet:
              path: /readyz
              port: internal
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /readyz
              port: internal
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            # Measured CPU: 1m idle, 6m with one SSE stream, 8m with three.
            requests: { cpu: 50m, memory: 256Mi }
            limits: { cpu: 1, memory: 768Mi }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
