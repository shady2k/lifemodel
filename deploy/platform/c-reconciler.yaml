# Shared persistent state lives beside each other in this platform-owned step.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-c
  namespace: flux-system
spec:
  interval: 10m0s
  timeout: 10m0s
  dependsOn:
    - name: platform-b
  path: ./state
  prune: true
  wait: true
  sourceRef:
    kind: OCIRepository
    name: platform
