# The storage module's own routes (ADR-015 S-D1). It inherits nothing from the
# loader: this policy is the whole of what it may do.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: storage-module-access
  namespace: lifemodel-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: storage-module
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Health is loader-only. No data or trusted caller reaches this listener.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: lifemodel-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: loader
      ports:
        - protocol: TCP
          port: 8081
    # Each peer is namespace AND Pod selector, never namespace-wide trust.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: lifemodel-motor
          podSelector:
            matchLabels:
              app.kubernetes.io/name: task
      ports:
        - protocol: TCP
          port: 8443
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: lifemodel
          podSelector:
            matchLabels:
              app.kubernetes.io/name: core
      ports:
        - protocol: TCP
          port: 8444
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: lifemodel
          podSelector:
            matchLabels:
              app.kubernetes.io/name: core
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: lifemodel
          podSelector:
            matchLabels:
              app.kubernetes.io/name: web
      ports:
        - protocol: TCP
          port: 8445
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Its own OpenBao login and the custody record it reads; never the loader's.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openbao
      ports:
        - protocol: TCP
          port: 8200
    # The one store it may use, on the S3 port only.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: lifemodel-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: seaweedfs
      ports:
        - protocol: TCP
          port: 8333
    # Its catalog, on the database Service's port. The database's own policy
    # admits this pod back (deploy/platform/state/network-policy.yaml).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: lifemodel-state
          podSelector:
            matchLabels:
              cnpg.io/cluster: lifemodel
      ports:
        - protocol: TCP
          port: 5432
    # k3s DNATs the API Service to the node address, which static manifests
    # cannot know. Follow the platform API pattern: TCP 6443 is the only
    # any-address exception, authenticated with the module's own API token.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 6443
---
# The caller side of the storage route; all other egress stays default-denied
# unless another platform policy explicitly grants it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: task-storage-egress
  namespace: lifemodel-motor
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: task
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: lifemodel-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: storage-module
      ports:
        - protocol: TCP
          port: 8443
---
# The caller side of the storage route; all other egress stays default-denied
# unless another platform policy explicitly grants it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: core-storage-egress
  namespace: lifemodel
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: core
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: lifemodel-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: storage-module
      ports:
        - protocol: TCP
          port: 8444
        - protocol: TCP
          port: 8445
---
# The caller side of the storage route; all other egress stays default-denied
# unless another platform policy explicitly grants it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-storage-egress
  namespace: lifemodel
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: web
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: lifemodel-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: storage-module
      ports:
        - protocol: TCP
          port: 8445

---
# Task names resolve cluster Services only through kube-dns; no other DNS route.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: task-dns-egress
  namespace: lifemodel-motor
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: task
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
# Task model traffic has a separate authenticated TLS listener (653.8.6).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: task-model-egress
  namespace: lifemodel-motor
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: task
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: lifemodel-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: model-gateway
      ports:
        - protocol: TCP
          port: 8446

---
# Gateway task ingress never exposes core API 8080 or status 8081.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: task-model-ingress
  namespace: lifemodel-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: model-gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: lifemodel-motor
          podSelector:
            matchLabels:
              app.kubernetes.io/name: task
      ports:
        - protocol: TCP
          port: 8446

---
# The durable task control stream is outbound to core, not core-to-task (653.8.8).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: task-channel-egress
  namespace: lifemodel-motor
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: task
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: lifemodel
          podSelector:
            matchLabels:
              app.kubernetes.io/name: core
      ports:
        - protocol: TCP
          port: 8447

---
# Only task Pods reach core task-channel TLS; owner/core health remains separate.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: task-channel-ingress
  namespace: lifemodel
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: core
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: lifemodel-motor
          podSelector:
            matchLabels:
              app.kubernetes.io/name: task
      ports:
        - protocol: TCP
          port: 8447

---
# k3s DNATs API Service 443 to the unknown node address: the existing platform
# pattern permits only TCP 6443. RBAC bounds the explicitly projected core token;
# task Pods receive neither this route nor an API token.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: core-task-api-egress
  namespace: lifemodel
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: core
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 6443
