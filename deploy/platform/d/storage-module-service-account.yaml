apiVersion: v1
kind: ServiceAccount
metadata:
  name: storage-module
  namespace: lifemodel-system
# The module's own token authenticates OpenBao login and its narrowly bound
# TokenReview/Pod/Job verification reads. Read it afresh, never use a caller's
# service-audience token as an API credential (ADR-015 S-D1/S-D2).
automountServiceAccountToken: true
