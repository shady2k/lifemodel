# The platform storage module (ADR-015 S-D1, S-D7), in the step after the
# database it reads.
#
# The loader's own image with its own entry point, like the model gateway: no
# generation ever builds or changes the code that holds the SeaweedFS
# credentials and the catalog login. Task, trusted control and trusted read
# use separate TLS listeners and service-audience identities (ADR-015 S-D2).
# Health stays on its own loader-only listener.
apiVersion: v1
kind: Service
metadata:
  name: storage-module
  namespace: lifemodel-system
spec:
  selector:
    app.kubernetes.io/name: storage-module
  ports:
    # Health, on its own listener: NetworkPolicies are L3/L4, so /status is not
    # exposed on a data port (ADR-015 S-D1).
    - name: status
      port: 8081
      targetPort: status
      protocol: TCP
    # Task data is distinct from trusted control and read (ADR-015 S-D1).
    - name: task
      port: 8443
      targetPort: task
      protocol: TCP
    - name: control
      port: 8444
      targetPort: control
      protocol: TCP
    - name: read
      port: 8445
      targetPort: read
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-module
  namespace: lifemodel-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: storage-module
  template:
    metadata:
      labels:
        app.kubernetes.io/name: storage-module
    spec:
      serviceAccountName: storage-module
      # OpenBao login and the module's TokenReview/Pod/Job API reads use this
      # API-audience token. Caller service-audience tokens are never API tokens.
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: storage-module
          # Kustomize pins the pushed loader digest, the same one A0 uses.
          image: ghcr.io/shady2k/lifemodel-loader:release-placeholder
          imagePullPolicy: IfNotPresent
          # The absolute path of the module's entry point, never the loader's
          # main.js and never the gateway's.
          command: ['node', '/opt/lifemodel/loader/dist/storage-module.js']
          env:
            - name: LIFEMODEL_OPENBAO_ADDRESS
              value: http://openbao.openbao.svc:8200
            - name: LIFEMODEL_STORAGE_S3_ENDPOINT
              value: http://seaweedfs.lifemodel-system.svc:8333
            - name: LIFEMODEL_STORAGE_BUCKET
              value: lifemodel-storage
            - name: LIFEMODEL_STORAGE_SETTINGS_PATH
              value: /opt/lifemodel/platform-settings/settings.json
            # The interim login the owner chose (lifemodel-653.7.8): the
            # database owner's own, copied by the loader into this namespace
            # until lifemodel-2t5 leases the module an identity. Only this pod
            # mounts the Secret, and the entry point never logs it.
            - name: LIFEMODEL_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: storage-module-db-credentials
                  key: username
            - name: LIFEMODEL_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: storage-module-db-credentials
                  key: password
            # The instance-CA leaf for this module's DNS names, written by the
            # loader (ADR-012 Decision 3) into the Secret only this pod mounts.
            - name: LIFEMODEL_STORAGE_TLS_DIR
              value: /opt/lifemodel/tls
          ports:
            - name: status
              containerPort: 8081
              protocol: TCP
            - name: task
              containerPort: 8443
              protocol: TCP
            - name: control
              containerPort: 8444
              protocol: TCP
            - name: read
              containerPort: 8445
              protocol: TCP
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          # Readiness is the catalog and the store (ADR-015 S-D7): an
          # unreachable database, a refused login, a missing storage schema, a
          # refused credential or a stopped SeaweedFS makes the module unready,
          # and it becomes ready again when they return.
          readinessProbe:
            httpGet:
              path: /status
              port: status
            periodSeconds: 10
            # The module answers within 3 s (STORAGE_HEALTH_DEFAULTS.boundMs),
            # so the probe's own timeout leaves two seconds of margin for the
            # response; a probe that fired earlier would cut a valid answer.
            timeoutSeconds: 5
            failureThreshold: 3
          # Liveness is this process, not the stores: a stopped database or
          # SeaweedFS must never restart the module that reports it.
          livenessProbe:
            httpGet:
              path: /livez
              port: status
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # The leaf the loader renews; the module re-reads it once a minute
            # and needs no restart to serve a new certificate.
            - name: tls
              mountPath: /opt/lifemodel/tls
              readOnly: true
            # Directory mount (no subPath), so kubelet refreshes each revision.
            - name: platform-settings
              mountPath: /opt/lifemodel/platform-settings
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
        - name: tls
          secret:
            secretName: storage-module-tls
            # Group read: the pod's fsGroup owns the mounted files.
            defaultMode: 288
        # Optional breaks any bootstrap dependency on the projection: the
        # reader uses declared defaults until loader creates the ConfigMap.
        - name: platform-settings
          configMap:
            name: lifemodel-storage-settings
            optional: true
