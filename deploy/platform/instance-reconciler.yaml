apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-instance
  namespace: flux-system
spec:
  interval: 10m0s
  timeout: 2m0s
  path: ./instance
  prune: true
  wait: true
  sourceRef:
    kind: OCIRepository
    name: platform
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: lifemodel-instance
        optional: false
