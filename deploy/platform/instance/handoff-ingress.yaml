apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-auth-handoff
  namespace: lifemodel-system
  annotations:
    traefik.ingress.kubernetes.io/router.priority: '200'
spec:
  ingressClassName: traefik
  rules:
    - host: ${LIFEMODEL_NAME}.local
      http:
        paths:
          - path: /_auth/handoff
            pathType: Exact
            backend:
              service:
                name: loader
                port:
                  number: 7000
