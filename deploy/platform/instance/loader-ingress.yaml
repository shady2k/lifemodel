apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: loader-public
  namespace: lifemodel-system
  annotations:
    traefik.ingress.kubernetes.io/router.priority: '100'
spec:
  ingressClassName: traefik
  rules:
    - host: boot-${LIFEMODEL_NAME}.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: loader
                port:
                  number: 7000
