apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - instance-reconciler.yaml
  - a0-reconciler.yaml
  - a-reconciler.yaml
  - b-reconciler.yaml
  - c-reconciler.yaml
  - d-reconciler.yaml

# Platform order: A0 -> A -> B (CNPG CRDs/operator) -> C (shared state) ->
# D (the storage module, which reads the database C creates). Each later step
# declares its dependency in its reconciler.
