# The log store's own step (ADR-016 §1). It depends only on platform-instance:
# the store needs a namespace and its volume, nothing from A, B, C or D, so a
# database repair or a broken later step never takes the logs with it.
#
# wait: false is what keeps a broken log pod out of the platform's readiness:
# the root Kustomization runs wait: true, and a child at wait: true whose pod
# cannot start would keep the root NotReady (ADR-016 §1, check L09).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-logs-store
  namespace: flux-system
spec:
  interval: 10m0s
  timeout: 10m0s
  dependsOn:
    - name: platform-instance
  path: ./logs-store
  prune: true
  wait: false
  sourceRef:
    kind: OCIRepository
    name: platform
