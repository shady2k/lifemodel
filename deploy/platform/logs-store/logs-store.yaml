# The log store (ADR-016 §1, §3, §5): one VictoriaLogs process on the volume of
# its own, reachable only by the collector and the loader. It runs as the
# restricted level its namespace enforces: uid 1000, gid 1000, fsGroup 1000.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: logs-store
  namespace: lifemodel-system
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: logs-store
  namespace: lifemodel-system
spec:
  selector:
    app.kubernetes.io/name: logs-store
  ports:
    - name: http
      port: 9428
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logs-store
  namespace: lifemodel-system
spec:
  replicas: 1
  # One pod owns the single volume. Recreate is what makes a settings change
  # replace the pod instead of overlapping two writers on one directory.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: logs-store
  template:
    metadata:
      labels:
        app.kubernetes.io/name: logs-store
    spec:
      serviceAccountName: logs-store
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: logs-store
          image: docker.io/victoriametrics/victoria-logs@sha256:251121fa882af99b95ba0c230a4a2f412ea602d2698c64a96c58dc9842bb755d
          imagePullPolicy: IfNotPresent
          # The store declares no retention argument of its own: retention
          # arrives only through the two ConfigMaps below, so no second,
          # competing retention statement exists. Deletion is never enabled.
          args:
            - -envflag.enable
            - -envflag.prefix=VL_
            - -httpListenAddr=:9428
            - -storageDataPath=/data
            # The partition key, read from the one file only the store and the
            # evictor hold (ADR-016 §5): the detach endpoint takes it as its
            # query argument, and the process prints it nowhere - its own /flags
            # answers -partitionManageAuthKey="secret".
            - -partitionManageAuthKey=file:///etc/vl/partition-key
          envFrom:
            - configMapRef:
                name: lifemodel-logs-settings-defaults
            - configMapRef:
                name: lifemodel-logs-settings
                optional: true
          ports:
            - name: http
              containerPort: 9428
              protocol: TCP
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              cpu: "3"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: partition-key
              mountPath: /etc/vl
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: logs-store
        - name: partition-key
          secret:
            secretName: lifemodel-logs-partition-key
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
