# The collector's identity (ADR-016 §7): read-only Kubernetes metadata, and
# nothing else. kubernetes_logs needs all three resources; without nodes it
# cannot annotate an event with its node.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: logs-collector
  namespace: lifemodel-logs
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: logs-collector
rules:
  - apiGroups: [""]
    resources:
      - pods
      - namespaces
      - nodes
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: logs-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: logs-collector
subjects:
  - kind: ServiceAccount
    name: logs-collector
    namespace: lifemodel-logs
