# The collector (ADR-016 §1, §2, §3): one Vector DaemonSet that reads every
# pod's log files on the node, normalizes each line with the VRL program in
# config/vector.yaml, and writes newline-delimited JSON to the store. The record
# shape is decided there, once, before the store: the page filters stored fields
# and parses nothing.
#
# The configuration is generated, not declared here under a fixed name: the
# step's kustomization turns config/vector.yaml into a ConfigMap whose name
# carries its content hash, and the volume below is rewritten to that name, so
# a release that changes the configuration replaces this pod (ADR-016 §1).
# Vector runs with `--config /etc/vector/vector.yaml` and no `--watch-config`,
# so a fixed name would leave a running collector on its old configuration.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: logs-collector
  namespace: lifemodel-logs
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: logs-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: logs-collector
    spec:
      serviceAccountName: logs-collector
      automountServiceAccountToken: true
      tolerations:
        # One collector on every node, including the platform's sole server.
        - operator: Exists
      securityContext:
        # uid 0 with every capability dropped is the measured working shape:
        # a non-root user with CAP_DAC_READ_SEARCH is not ambient across exec,
        # and /var/log/pods is 0750 root:root (ADR-016 §7).
        runAsUser: 0
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: logs-collector
          image: docker.io/timberio/vector@sha256:f6c23b5a7e16fb2838d33619ef7acf4bad2289a7cf22bc90efc2371f520c4ea2
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /etc/vector/vector.yaml
          env:
            - name: VECTOR_SELF_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          livenessProbe:
            exec:
              command: ['/bin/bash', '/etc/vector/check-delivery.sh']
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 1
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 300Mi
          volumeMounts:
            # The kubelet's files, read-only.
            - name: pods
              mountPath: /var/log/pods
              readOnly: true
            # Checkpoints and sink buffer share a sibling of the store's /data
            # on the dedicated log filesystem. No root-filesystem fallback.
            - name: checkpoints
              mountPath: /var/lib/lifemodel-logs-collector
            - name: config
              mountPath: /etc/vector
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: pods
          hostPath:
            path: /var/log/pods
            type: Directory
        - name: checkpoints
          hostPath:
            path: /var/lib/lifemodel-logs/collector
            type: Directory
        - name: config
          configMap:
            name: logs-collector-config
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
