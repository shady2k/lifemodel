apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: loader-copy-cnpg-credentials
  namespace: lifemodel-state
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["lifemodel-app"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: loader-copy-cnpg-credentials
  namespace: lifemodel-state
subjects:
  - kind: ServiceAccount
    name: loader
    namespace: lifemodel-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: loader-copy-cnpg-credentials
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: loader-copy-cnpg-credentials
  namespace: lifemodel
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["lifemodel-db-credentials"]
    verbs: ["get", "update"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: loader-copy-cnpg-credentials
  namespace: lifemodel
subjects:
  - kind: ServiceAccount
    name: loader
    namespace: lifemodel-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: loader-copy-cnpg-credentials
