apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lifemodel-state-default-deny
  namespace: lifemodel-state
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lifemodel-state-postgres-access
  namespace: lifemodel-state
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: lifemodel
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: lifemodel
      ports:
        - protocol: TCP
          port: 5432
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8000
  egress: []
