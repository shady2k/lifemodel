apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lifemodel-state-default-deny
  namespace: lifemodel-state
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lifemodel-state-postgres-access
  namespace: lifemodel-state
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: lifemodel
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: lifemodel
      ports:
        - protocol: TCP
          port: 5432
    # The storage module's catalog (ADR-015 S-D7). Its own step policy carries
    # the matching egress; this side names the one pod that may connect.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: lifemodel-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: storage-module
      ports:
        - protocol: TCP
          port: 5432
    # Gateway task identity uses canonical intent and writes the binding/claim.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: lifemodel-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: model-gateway
      ports:
        - protocol: TCP
          port: 5432
    # Loader applies optional capture function grants once the role exists.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: lifemodel-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: loader
      ports:
        - protocol: TCP
          port: 5432
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8000
  egress:
    # CNPG instance manager needs cluster DNS and the Kubernetes API.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # k3s DNATs the in-cluster API Service to the node address; static platform
    # manifests cannot know that address. Allow any destination on TCP 6443.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 6443
